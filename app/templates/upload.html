{% extends "base.html" %}


{% block title %}上传文件{% endblock %}


{% block content %}
<form id="upload-form">
    <label for="file">选择文件：</label>
    <input type="file" id="file" name="file" class="file-input">
    <button type="submit" id="upload-button">上传</button>
</form>
{% endblock %}


{% block scripts %}
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
{% endblock %}
